name: Temporary CC0 SFX candidate export
on:
  push:
    branches: [tmp/cc0-sfx-candidates-20260913]
    paths: [.github/workflows/cc0-sfx-candidates.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download CC0 source packs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p cc0/{doomsday,theremin,rubberduck,kenney-scifi,kenney-digital}
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/doomsday_laser_cannon_long.wav' -o cc0/doomsday/doomsday_laser_cannon_long.wav
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/doomsday_laser_cannon_midium_.wav' -o cc0/doomsday/doomsday_laser_cannon_medium.wav
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/doomsday_laser_cannon_short.wav' -o cc0/doomsday/doomsday_laser_cannon_short.wav
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/theremin_lasers.zip' -o /tmp/theremin.zip
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/60-sci-fi-sfx_0.zip' -o /tmp/rubberduck.zip
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/sci-fi_sounds.zip' -o /tmp/kenney-scifi.zip
          curl -fL --retry 4 --retry-delay 2 'https://opengameart.org/sites/default/files/Digital_SFX_Set.zip' -o /tmp/kenney-digital.zip
          unzip -q /tmp/theremin.zip -d cc0/theremin
          unzip -q /tmp/rubberduck.zip -d cc0/rubberduck
          unzip -q /tmp/kenney-scifi.zip -d cc0/kenney-scifi
          unzip -q /tmp/kenney-digital.zip -d cc0/kenney-digital
      - name: Record inventory
        shell: bash
        run: |
          set -euxo pipefail
          find cc0 -type f -print0 | sort -z | xargs -0 sha256sum > cc0/SHA256SUMS.txt
          find cc0 -type f | sort > cc0/FILES.txt
          cat > cc0/SOURCES.txt <<'EOF'
          All source pages below state CC0 at retrieval time (2026-09-13):
          https://opengameart.org/content/doomsday-laser-cannon-sound-effect
          https://opengameart.org/content/theremin-laser-sfx
          https://opengameart.org/content/60-cc0-sci-fi-sfx
          https://opengameart.org/content/sci-fi-sounds
          https://opengameart.org/content/63-digital-sound-effects-lasers-phasers-space-etc
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cc0-sfx-candidates
          path: cc0
          retention-days: 1
          if-no-files-found: error
