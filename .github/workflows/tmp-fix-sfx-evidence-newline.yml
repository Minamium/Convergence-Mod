name: Temporary fix SFX evidence newline

on:
  push:
    branches:
      - audio/orchestral-abc-0.2.42

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/orchestral-abc-0.2.42
          fetch-depth: 0
      - name: Patch generator and remove fixer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tmp-prismatic-sfx-0242.yml')
          text=p.read_text(encoding='utf-8')
          old="Path('docs/evidence/2026-09-10-prismatic-sfx-rebuild.json').write_text(json.dumps(evidence,indent=2),encoding='utf-8')"
          new="Path('docs/evidence/2026-09-10-prismatic-sfx-rebuild.json').write_text(json.dumps(evidence,indent=2)+'\\n',encoding='utf-8')"
          if old not in text:
              raise SystemExit('expected evidence writer not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/tmp-fix-sfx-evidence-newline.yml').unlink()
          PY
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix SFX evidence newline verification'
          git push origin HEAD:audio/orchestral-abc-0.2.42
