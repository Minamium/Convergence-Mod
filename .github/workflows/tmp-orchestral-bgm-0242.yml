          text=text.replace('last_reviewed: 2026-09-09','last_reviewed: 2026-09-10',1)
          text=text.replace('Development **0.2.41**, protocol **28**.','Development **0.2.42**, protocol **28**.',1)
          marker='Development **0.2.42**, protocol **28**.'
          summary=' The BGM-only orchestral pass replaces all four phase masters with continuous A/B/C development using the existing musical language; Phase I-III are no longer action-cycle-length loops, while Final alone remains fitted to its current score. The A-to-B handoff preserves the accepted intro through the downbeat and changes articulation/density rather than fading the master out. Combat, network protocol, damage, weapons, SFX and server-wide preparation are unchanged.'
          text=text.replace(marker,marker+summary,1)
          vhead='## Verification state\n\n'
          vpara='[0.2.42 BGM checks](evidence/2026-09-10-orchestral-bgm-abc.json) own the four-master decode/finite/stereo/48kHz/duration/peak evidence and repository static verification. The owner accepted the preceding V13 composition/orchestration direction; 0.2.42 additionally removes the multi-bar A-to-B fade by carrying A to the B downbeat. Actual in-game loop seam, phase-change mix and multiplayer listening remain user-owned `not_run`; no gameplay or protocol contract changed.\n\n'
          if vhead not in text: raise RuntimeError('verification heading missing')
          text=text.replace(vhead,vhead+vpara,1)
          nhead='## Next change\n\n'
          npara='User-owned 0.2.42: reload/restart matching peers, enter each Boss phase and listen through A -> B -> C. Confirm the B downbeat no longer reads as a master fade, Phase I remains restrained, Phase II/III gain urgency through acoustic articulation rather than retro/electronic timbre, and Final reaches its ending before the encounter resolves. Also listen across each ordinary loop seam. SFX are intentionally unchanged in this branch.\n\n'
          if nhead not in text: raise RuntimeError('next heading missing')
          text=text.replace(nhead,nhead+npara,1)
          status.write_text(text,encoding='utf-8')

          attr=Path('Assets/ATTRIBUTION.md')
          text=attr.read_text(encoding='utf-8')
          if '### Continuous orchestral A/B/C BGM rebuild — 0.2.42 / 2026-09-10' in text:
              raise RuntimeError('attribution section already exists')
          records=[]
          names={1:'ObsidianLiturgy.ogg',2:'UnboundLiturgy.ogg',3:'DistantLiturgy.ogg',4:'TerminalLiturgy.ogg'}
          ids={1:'obsidian-liturgy-abc-0242-20260910',2:'unbound-liturgy-abc-0242-20260910',3:'distant-liturgy-abc-0242-20260910',4:'terminal-liturgy-abc-0242-20260910'}
          for phase in range(1,5):
              r=by[phase]
              records.append(f'''- Runtime file: `Assets/Music/{names[phase]}`\n- Asset ID: {ids[phase]}\n- Asset type: music\n- Creator: project-directed original composition/orchestration/render by Codex; instrumental sample recordings by Sam Gossner and Simon Dalzell / Versilian Studios, sample cutting by Elan Hickler\n- Creation/acquisition date: 2026-09-10\n- Source type: original continuation/re-orchestration of the existing project composition\n- Source work and URL: existing Convergence A master plus new project-authored B/C note events; instrumental library [VSCO 2 CE official distribution](https://versilian-studios.com/vsco-community/), pinned revision `440300901dfe9275fd84e0b7763af1f8443ae62e`, [CC0 license](https://raw.githubusercontent.com/sgossner/VSCO-2-CE/440300901dfe9275fd84e0b7763af1f8443ae62e/LICENSE)\n- Tool/model/version: Python 3.12; NumPy 2.3.5, SciPy 1.16.1, SoundFile 0.14.0/libsndfile, pyloudnorm 0.1.1, FFmpeg/libvorbis; independent sample player, original formant synthesis and diffuse reflection mix\n- Human modifications: owner accepted V13 composition direction and requested A-to-B continuity repair; agent retained A through the B downbeat, authored B/C note events, articulation progression, dynamics and mix\n- License and redistribution terms: instrumental samples CC0-1.0; project composition/recording terms remain under the existing development publication gate\n- Required attribution: retain this provenance; no WotG/Calamity music or recording imported\n- Reviewer and review date: Codex automated decode/finite/48kHz/stereo/duration/peak checks, 2026-09-10; owner in-game final mix/loop review pending\n- Notes: Phase {phase}; {r['bpm']:.3f} BPM; {r['duration_seconds']:.6f}s; encoded bytes {r['encoded_bytes']}; decoded peak {r['decoded_peak']:.6f}; SHA256 `{r['sha256']}`.\n''')
