name: Temporary orchestral BGM 0.2.42

on:
  push:
    branches:
      - audio/orchestral-abc-0.2.42

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/orchestral-abc-0.2.42
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scipy==1.16.1 soundfile==0.14.0 pyloudnorm==0.1.1

      - name: Render four orchestral A-B-C masters
        shell: bash
        run: |
          cat > /tmp/render_bgm.py <<'PY'
          from __future__ import annotations
          from dataclasses import dataclass
          from pathlib import Path
          from urllib.parse import quote
          import hashlib, json, math, subprocess, urllib.request
          import numpy as np
          import soundfile as sf
          import pyloudnorm as pyln
          from scipy.signal import butter, sosfilt, resample_poly

          SR = 48000
          ROOT = Path('.').resolve()
          CACHE = Path('/tmp/vsco-audio-0242')
          CACHE.mkdir(parents=True, exist_ok=True)
          REV = '440300901dfe9275fd84e0b7763af1f8443ae62e'
          RAW = f'https://raw.githubusercontent.com/sgossner/VSCO-2-CE/{REV}/'
          RNG = np.random.default_rng(20260910)

          # Exact CC0 source set. These are the same VSCO 2 CE family already
          # documented for the existing Convergence music masters.
          SOURCE_SPECS = {
              'vln_sus_57': ('Strings/Violin Section/susVib/VlnEns_susVib_A3_v1.wav', 57),
              'vln_sus_71': ('Strings/Violin Section/susVib/VlnEns_susVib_B4_v1.wav', 71),
              'vln_trem_57': ('Strings/Violin Section/Trem/VlnEns_Trem_A3_v1.wav', 57),
              'vln_trem_71': ('Strings/Violin Section/Trem/VlnEns_Trem_B4_v1.wav', 71),
              'vln_spic_57': ('Strings/Violin Section/Spic/VlnEns_Spic_A3_v1_rr1.wav', 57),
              'vln_spic_71': ('Strings/Violin Section/Spic/VlnEns_Spic_B4_v1_rr1.wav', 71),
              'cello_sus_35': ('Strings/Cello Section/susvib/susvib_B1_v1_1.wav', 35),
              'cello_sus_59': ('Strings/Cello Section/susvib/susvib_B3_v1_1.wav', 59),
              'cello_spic_35': ('Strings/Cello Section/spic/spic_B1_v1_RR1.wav', 35),
              'cello_spic_59': ('Strings/Cello Section/spic/spic_B3_v1_RR1.wav', 59),
              'viola_sus_47': ('Strings/Viola Section/susvib/ViolaEns_susvib_B2_v1_1.wav', 47),
              'viola_sus_57': ('Strings/Viola Section/susvib/ViolaEns_susvib_A3_v1_1.wav', 57),
              'horn_sus_45': ('Brass/F Horn/sus/MOHorn_sus_A2_v1_1.wav', 45),
              'horn_stac_45': ('Brass/F Horn/stac/MOHorn_stac_A2_v1_rr1.wav', 45),
              'bass_drum': ('Percussion/BDrumNewhit_v1_rr1_Sum.wav', 36),
          }

          def download_sources():
              for key, (rel, _) in SOURCE_SPECS.items():
                  dst = CACHE / f'{key}.wav'
                  if dst.exists():
                      continue
                  url = RAW + quote(rel, safe='/')
                  urllib.request.urlretrieve(url, dst)

          def mono48(path: Path):
              x, sr = sf.read(path, always_2d=True, dtype='float32')
              x = x.mean(axis=1)
              if sr != SR:
                  from math import gcd
                  g = gcd(sr, SR)
                  x = resample_poly(x, SR // g, sr // g).astype(np.float32)
              x -= float(np.mean(x[:min(len(x), 2048)]))
              p = float(np.max(np.abs(x)))
              if p > 1e-6:
                  x = x / p
              return x.astype(np.float32)

          download_sources()
          SAMPLES = {k: (mono48(CACHE / f'{k}.wav'), root) for k, (_, root) in SOURCE_SPECS.items()}

          @dataclass
          class Note:
              beat: float
              dur: float
              role: str
              pitch: int
              vel: int

          class Score:
              def __init__(self, bpm: float):
                  self.bpm = float(bpm)
                  self.notes: list[Note] = []
              def add(self, beat, dur, role, pitch, vel):
                  if dur > 0 and 0 <= int(pitch) <= 127:
                      self.notes.append(Note(float(beat), float(dur), role, int(pitch), int(np.clip(vel, 1, 127))))

          ROLE_PAN = {
              'vln1': -.34, 'vln2': .30, 'viola': .12, 'cello': -.12, 'bass': 0,
              'trem': .22, 'short': -.20, 'horn': .26, 'lowbrass': -.18,
              'choir': 0, 'timp': 0,
          }
          ROLE_GAIN = {
              'vln1': .46, 'vln2': .40, 'viola': .38, 'cello': .45, 'bass': .40,
              'trem': .38, 'short': .39, 'horn': .36, 'lowbrass': .31,
              'choir': .20, 'timp': .34,
          }

          def choose(keys, note):
              return min(keys, key=lambda k: abs(SAMPLES[k][1] - note))

          def pitched(src, semis):
              rate = 2.0 ** (semis / 12.0)
              n = max(8, int(len(src) / rate))
              pos = np.arange(n, dtype=np.float64) * rate
              return np.interp(pos, np.arange(len(src)), src).astype(np.float32)

          def loop_sustain(x, n):
              if len(x) >= n:
                  return x[:n].copy()
              if len(x) < int(.30 * SR):
                  return np.resize(x, n).astype(np.float32)
              ls = int(len(x) * .28)
              le = max(ls + 256, int(len(x) * .78))
              loop = x[ls:le]
              out = np.zeros(n, np.float32)
              first = min(n, le)
              out[:first] = x[:first]
              pos = first
              cf = min(int(.025 * SR), max(32, len(loop)//8))
              while pos < n:
                  take = min(len(loop), n - pos)
                  seg = loop[:take].copy()
                  if pos > 0 and take > cf:
                      c = min(cf, take, pos)
                      u = np.linspace(0, 1, c, dtype=np.float32)
                      a = np.cos(u * np.pi / 2)
                      b = np.sin(u * np.pi / 2)
                      out[pos-c:pos] = out[pos-c:pos] * a + seg[:c] * b
                      seg = seg[c:]
                      take -= c
                  if take > 0:
                      out[pos:pos+take] = seg[:take]
                      pos += take
                  else:
                      pos += c
              return out

          def envelope(x, dur_s, attack=.045, release=.11):
              n = min(len(x), max(1, int(round(dur_s * SR))))
              y = x[:n].copy()
              a = min(n, int(attack * SR)); r = min(n, int(release * SR))
              if a > 1:
                  y[:a] *= np.sin(np.linspace(0, np.pi/2, a)) ** 1.25
              if r > 1:
                  y[-r:] *= np.cos(np.linspace(0, np.pi/2, r)) ** 1.10
              return y

          def formant_voice(note, dur_s, vel):
              n = max(1, int(round(dur_s * SR)))
              t = np.arange(n) / SR
              f0 = 440 * 2 ** ((note - 69) / 12)
              y = np.zeros(n, np.float64)
              formants = [(520, 120, .70), (1480, 230, .40), (2480, 300, .18)]
              for h in range(1, 18):
                  f = f0 * h
                  if f >= SR * .45:
                      break
                  w = .03
                  for fc, bw, amp in formants:
                      w += amp * math.exp(-.5 * ((f-fc)/bw)**2)
                  y += (w / (h**1.20)) * np.sin(2*np.pi*f*t + h*.17)
              y *= .65 + .35*np.sin(2*np.pi*5.2*t + note*.3)
              y /= max(1e-6, np.max(np.abs(y)))
              y = envelope(y.astype(np.float32), dur_s, .12, .22)
              return y * ((vel/127) ** 1.5)

          def render_note(n: Note, bpm):
              dur_s = n.dur * 60 / bpm
              if n.role == 'choir':
                  return formant_voice(n.pitch, dur_s, n.vel)
              if n.role == 'timp':
                  key = 'bass_drum'
                  src, root = SAMPLES[key]
                  y = pitched(src, n.pitch-root)
                  y = envelope(y, min(dur_s, max(.35, len(y)/SR)), .003, .14)
              else:
                  if n.role in ('vln1','vln2'):
                      key = choose(['vln_sus_57','vln_sus_71'], n.pitch)
                      sustain = True
                  elif n.role == 'trem':
                      key = choose(['vln_trem_57','vln_trem_71'], n.pitch)
                      sustain = True
                  elif n.role == 'short':
                      key = choose(['vln_spic_57','vln_spic_71'], n.pitch)
                      sustain = False
                  elif n.role == 'viola':
                      key = choose(['viola_sus_47','viola_sus_57'], n.pitch)
                      sustain = True
                  elif n.role in ('cello','bass'):
                      key = choose(['cello_sus_35','cello_sus_59'], n.pitch)
                      sustain = True
                  elif n.role in ('horn','lowbrass'):
                      key = 'horn_stac_45' if dur_s < .95 else 'horn_sus_45'
                      sustain = dur_s >= .95
                  else:
                      raise ValueError(n.role)
                  src, root = SAMPLES[key]
                  y = pitched(src, n.pitch-root)
                  target = max(1, int(round(dur_s*SR)))
                  if sustain:
                      y = loop_sustain(y, target)
                      y = envelope(y, dur_s, .055 if n.role!='horn' else .08, .13)
                  else:
                      y = envelope(y, min(dur_s, len(y)/SR), .002, .07)
              return y * ((n.vel/127) ** 1.60) * ROLE_GAIN[n.role]

          def add_pan(bus, mono, start_s, pan):
              i = int(round(start_s * SR))
              if i >= len(bus):
                  return
              n = min(len(mono), len(bus)-i)
              l = math.cos((pan+1)*math.pi/4)
              r = math.sin((pan+1)*math.pi/4)
              bus[i:i+n,0] += mono[:n]*l
              bus[i:i+n,1] += mono[:n]*r

          def hall(x):
              y = x.copy()
              taps = [(.043,.055),(.071,.050),(.101,.045),(.139,.040),(.187,.035),(.251,.029),(.337,.023),(.457,.017),(.613,.012)]
              for j,(sec,g) in enumerate(taps):
                  d = int(sec*SR)
                  if d >= len(x):
                      continue
                  z = np.zeros_like(x)
                  z[d:] = x[:-d]*g
                  if j%2:
                      z = z[:,::-1]
                  y += z
              return sosfilt(butter(2, 10000, btype='lowpass', fs=SR, output='sos'), y, axis=0).astype(np.float32)

          def render_score(sc: Score, bars: int):
              total_s = bars * 4 * 60 / sc.bpm
              bus = np.zeros((int(round((total_s+1.5)*SR)),2), np.float32)
              for n in sc.notes:
                  mono = render_note(n, sc.bpm)
                  add_pan(bus, mono, n.beat*60/sc.bpm, ROLE_PAN[n.role])
              return hall(bus), total_s

          def nearest(pc, center):
              return min([p for p in range(center-12,center+13) if p%12 == pc%12], key=lambda p: abs(p-center))

          MOTIF = [2,3,9,7,5,3,2,1]  # D-Eb-A-G-F-Eb-D-C#
          def motif(sc,b,vel,role='vln1',center=74,unit=.5,invert=False):
              pcs = [9,7,5,3,2,3,1,2] if invert else MOTIF
              durs = [1,1,2,1,1,1,1,2]
              t=b
              for pc,d in zip(pcs,durs):
                  sc.add(t,d*unit*.88,role,nearest(pc,center),vel)
                  t += d*unit

          CHORDS = {
            1:{'D':[38,45,50,53,57,62,65,69],'Eb':[39,46,51,55,58,63,67,70],'BbD':[38,46,53,58,62,65,70],'Cs':[37,44,49,52,55,61,62,68],'Gm':[43,50,55,58,62,67,70]},
            2:{'D':[38,45,50,53,54,57,62,66],'Eb':[39,46,51,54,58,63,66,70],'F':[41,48,53,54,57,60,65,66],'Cs':[37,44,49,54,56,61,66,68],'BbD':[38,46,53,58,62,65,70],'Gm':[43,50,55,58,62,66,70]},
            3:{'D':[38,45,50,54,57,63,66,69],'Eb':[39,46,51,54,58,60,63,66],'Fs':[42,49,54,57,61,62,66,69],'Cs':[37,44,49,54,56,60,61,66],'BbD':[38,46,54,58,62,66,70],'Gm':[43,50,55,58,62,66,70]},
          }
          CHORDS[4] = CHORDS[3]

          BPROG = {
            1:['D','D','BbD','BbD','Gm','Gm','Eb','Cs','D','BbD','Gm','Eb','BbD','Gm','Eb','Cs'],
            2:['D','D','BbD','Eb','Gm','F','Eb','Cs','D','F','BbD','Gm','Eb','F','Eb','Cs'],
            3:['D','D','BbD','Eb','Gm','Fs','Eb','Cs','D','Fs','BbD','Gm','Eb','Fs','Eb','Cs'],
            4:['D','D','BbD','Eb','Gm','Fs','Eb','Cs','D','Fs','BbD','Gm','Eb','Fs','Eb','Cs'],
          }
          CPROG = {
            1:['D','Eb','BbD','Gm','D','Eb','Gm','Cs','BbD','Gm','Eb','D','Gm','Eb','BbD','Cs'],
            2:['D','Eb','F','BbD','D','Gm','F','Cs','BbD','F','Eb','D','Gm','F','Eb','Cs'],
            3:['D','Eb','Fs','BbD','D','Gm','Fs','Cs','BbD','Fs','Eb','D','Gm','Fs','Eb','Cs'],
            4:['D','Eb','Fs','BbD','D','Gm','Fs','Cs','BbD','Fs','Eb','D','Gm','Fs','Eb','Cs'],
          }

          def voice(sc,b,phase,k,vel,trem=False):
              p=CHORDS[phase][k]
              sc.add(b,3.70,'bass',p[0],vel-15)
              sc.add(b,3.62,'cello',p[2],vel-10)
              sc.add(b,3.55,'viola',p[3],vel-12)
              hi='trem' if trem else 'vln2'
              sc.add(b,3.42,hi,p[-3],vel-7)
              sc.add(b,3.38,hi,p[-2],vel-4)
              if vel>=72:
                  sc.add(b,3.05,'horn',p[2],vel-19)
              if vel>=90:
                  sc.add(b,2.70,'lowbrass',p[0]+12,vel-28)
              if vel<65:
                  sc.add(b,3.15,'choir',p[2],max(28,vel-24))
                  sc.add(b,3.00,'choir',p[-3],max(26,vel-27))

          def ost(sc,b,phase,k,vel,sub=.5,accent332=False):
              p=CHORDS[phase][k]
              seq=[p[-3],p[-2],p[-1],p[-2]]
              for i in range(int(round(4/sub))):
                  v=vel+(9 if accent332 and i%8 in (0,3,6) else 0)
                  sc.add(b+i*sub,sub*.52,'short',seq[i%4],v)

          def timp(sc,b,phase,k,vel):
              p=CHORDS[phase][k]
              sc.add(b,.58,'timp',p[0],vel)
              sc.add(b+2,.52,'timp',p[1],vel-6)

          def write_B(sc,phase,start_bar):
              a_dyn={1:64,2:72,3:78,4:80}[phase]
              for i,k in enumerate(BPROG[phase]):
                  b=(start_bar+i)*4
                  if i==0: dyn=a_dyn
                  elif i==1: dyn=a_dyn-7
                  elif i==2: dyn=51
                  elif i==3: dyn=49
                  else:
                      p=(i-3)/12
                      dyn=int(51+51*(p**1.72))
                  if i==0:
                      voice(sc,b,phase,k,dyn,trem=(phase>=3))
                      if phase>=2: ost(sc,b,phase,k,max(51,dyn-12),.5,phase>=3)
                  elif i<4:
                      voice(sc,b,phase,k,dyn,False)
                      if i==2: motif(sc,b+1,dyn+5,'cello',55,.42)
                  elif i<8:
                      voice(sc,b,phase,k,dyn,False)
                      p=CHORDS[phase][k]
                      sc.add(b,1.75,'trem',p[-2],dyn-4)
                      sc.add(b+2,1.45,'trem',p[-3],dyn-5)
                  elif i<12:
                      voice(sc,b,phase,k,dyn,True)
                      ost(sc,b,phase,k,dyn-7,.5,phase>=3)
                      if i%2==0: motif(sc,b,dyn+6,'vln1',74,.25)
                  else:
                      voice(sc,b,phase,k,dyn,True)
                      ost(sc,b,phase,k,dyn-3,.25,phase>=3)
                      if i%2==0: motif(sc,b+.5,dyn-7,'horn',60,.25)
                      timp(sc,b,phase,k,max(43,dyn-16))

          def write_C(sc,phase,start_bar,bars):
              prog=CPROG[phase]
              for i in range(bars):
                  k=prog[i%16]
                  b=(start_bar+i)*4
                  dyn=int(78+23*i/max(1,bars-1))
                  voice(sc,b,phase,k,dyn,trem=(phase>=2 or i>=8))
                  if phase==1:
                      if i%4 in (0,2): motif(sc,b,dyn+7,'vln1',76,.45,i%4==2)
                      if i>=8: ost(sc,b,phase,k,dyn-13,.5)
                      if i in (7,11,15): timp(sc,b,phase,k,dyn-20)
                  elif phase==2:
                      ost(sc,b,phase,k,dyn-8,.5 if i<8 else .25)
                      if i%2==0:
                          motif(sc,b,dyn+5,'vln1',77,.25)
                          motif(sc,b+1,dyn-10,'cello',55,.25,True)
                      else:
                          motif(sc,b+1.5,dyn-12,'horn',60,.25)
                      if i>=6: timp(sc,b,phase,k,dyn-16)
                  else:
                      ost(sc,b,phase,k,dyn-6,.5 if i<6 else .25,True)
                      if i%2==0: motif(sc,b,dyn+7,'vln1',78,.25,i%4==2)
                      if i>=4 and i%2: motif(sc,b+.75,dyn-8,'horn',62,.25)
                      timp(sc,b,phase,k,dyn-15)

          def band_rms(x, lo, hi):
              if lo <= 0:
                  y=sosfilt(butter(3,hi,btype='lowpass',fs=SR,output='sos'),x,axis=0)
              elif hi >= SR/2-1:
                  y=sosfilt(butter(3,lo,btype='highpass',fs=SR,output='sos'),x,axis=0)
              else:
                  y=sosfilt(butter(3,[lo,hi],btype='bandpass',fs=SR,output='sos'),x,axis=0)
              return float(np.sqrt(np.mean(y.astype(np.float64)**2)+1e-12))

          def tonal_match(x, ref):
              low=sosfilt(butter(3,260,btype='lowpass',fs=SR,output='sos'),x,axis=0)
              high=sosfilt(butter(3,2800,btype='highpass',fs=SR,output='sos'),x,axis=0)
              mid=x-low-high
              gains=[]
              for lo,hi,part in [(0,260,low),(260,2800,mid),(2800,SR/2-1,high)]:
                  a=band_rms(ref,lo,hi); b=max(1e-8,band_rms(x,lo,hi))
                  gains.append(float(np.clip(a/b,10**(-4/20),10**(4/20))))
              y=low*gains[0]+mid*gains[1]+high*gains[2]
              return y.astype(np.float32), gains

          def width_match(x,ref):
              m=(x[:,0]+x[:,1])*.5; s=(x[:,0]-x[:,1])*.5
              rm=(ref[:,0]+ref[:,1])*.5; rs=(ref[:,0]-ref[:,1])*.5
              want=(np.std(rs)+1e-7)/(np.std(rm)+1e-7)
              have=(np.std(s)+1e-7)/(np.std(m)+1e-7)
              s*=float(np.clip(want/have,.65,1.5))
              return np.column_stack([m+s,m-s]).astype(np.float32)

          def equal_power(n):
              u=np.linspace(0,np.pi/2,n)
              return np.sin(u), np.cos(u)

          def master_phase(phase, src_path, bpm, a_bars, b_bars, c_bars, total_bars, final_seconds=None):
              sc=Score(bpm)
              write_B(sc,phase,0)
              write_C(sc,phase,b_bars,c_bars)
              bc, bc_seconds = render_score(sc,b_bars+c_bars)
              bc = bc[:int(round(bc_seconds*SR))]

              src, sr = sf.read(src_path, always_2d=True, dtype='float32')
              if sr != SR:
                  raise RuntimeError(f'{src_path}: expected 48kHz')
              a_seconds = a_bars*4*60/bpm
              a_n = int(round(a_seconds*SR))
              if len(src) < a_n:
                  raise RuntimeError(f'{src_path}: source shorter than requested A')
              A = src[:a_n].copy()

              # Match the B entry to the actual A ending, without a multi-bar fade.
              ref = A[max(0,len(A)-int(4*SR)):]
              head = bc[:min(len(bc),int(4*SR))]
              bc, band_gains = tonal_match(bc, ref)
              bc = width_match(bc, ref)
              meter=pyln.Meter(SR)
              try:
                  lr=meter.integrated_loudness(ref)
                  lh=meter.integrated_loudness(head)
                  # Re-evaluate after tonal match with the new head.
                  lh=meter.integrated_loudness(bc[:min(len(bc),int(4*SR))])
                  bc*=10**(((lr-.55)-lh)/20)
              except Exception:
                  pass

              total_seconds = final_seconds if final_seconds is not None else total_bars*4*60/bpm
              target=int(round(total_seconds*SR))
              y=np.zeros((target,2),np.float32)
              keep=min(len(A),target)
              y[:keep]=A[:keep]
              pos=keep
              nbc=min(len(bc),target-pos)
              if nbc>0:
                  y[pos:pos+nbc]=bc[:nbc]

              # 90ms anti-click handoff only. A is otherwise untouched to B downbeat.
              h=min(int(.090*SR), keep, nbc)
              if h>1:
                  up,down=equal_power(h)
                  # crossfade centred just after the downbeat, preserving full A until there
                  start=keep-h
                  y[start:keep]=A[start:keep]*down[:,None]+bc[:h]*up[:,None]

              # Fold only the natural orchestral tail into the beginning of A for loop seam.
              tail=bc[nbc:min(len(bc),nbc+int(1.2*SR))]
              if len(tail):
                  m=min(len(tail),len(y))
                  y[:m]+=tail[:m]*np.linspace(.10,0,m)[:,None]

              y=np.nan_to_num(y)
              peak=float(np.max(np.abs(y)))
              if peak>.965:
                  y*=.965/peak
              return y, {
                  'phase':phase,'bpm':bpm,'duration_seconds':len(y)/SR,
                  'A_seconds':a_seconds,'B_seconds':b_bars*4*60/bpm,
                  'C_seconds':c_bars*4*60/bpm,'band_match_gains':band_gains,
                  'peak':float(np.max(np.abs(y))),
                  'rms':float(np.sqrt(np.mean(y.astype(np.float64)**2))),
              }

          phases = [
              (1,'Assets/Music/ObsidianLiturgy.ogg',96.0,16,16,16,48,None),
              (2,'Assets/Music/UnboundLiturgy.ogg',144.0,16,16,16,48,None),
              (3,'Assets/Music/DistantLiturgy.ogg',176.0,16,16,16,48,None),
          ]
          final_seconds = 3802/60 + 6.5
          final_bpm = 52*4*60/final_seconds
          phases.append((4,'Assets/Music/TerminalLiturgy.ogg',final_bpm,12,16,24,52,final_seconds))

          outdir=Path('/tmp/convergence-bgm-0242')
          outdir.mkdir(parents=True,exist_ok=True)
          reports=[]
          for phase,path,bpm,a,b,c,total,forced in phases:
              y, rep = master_phase(phase, ROOT/path, bpm,a,b,c,total,forced)
              wav=outdir/f'phase{phase}.wav'
              sf.write(wav,y,SR,subtype='PCM_24')
              dest=ROOT/path
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(wav),'-c:a','libvorbis','-q:a','6',str(dest)],check=True)
              dec,sr=sf.read(dest,always_2d=True,dtype='float32')
              if sr!=SR or dec.shape[1]!=2 or not np.isfinite(dec).all():
                  raise RuntimeError(f'{dest}: decode/format verification failed')
              if abs(len(dec)/SR-rep['duration_seconds']) > 1/SR:
                  raise RuntimeError(f'{dest}: duration changed after encode')
              if float(np.max(np.abs(dec))) >= .995:
                  raise RuntimeError(f'{dest}: encoded peak too high')
              rep.update({
                  'runtime_file':path,
                  'encoded_bytes':dest.stat().st_size,
                  'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),
                  'decoded_peak':float(np.max(np.abs(dec))),
              })
              reports.append(rep)

          # Audition artifact: 5s before and 10s after A->B for each phase.
          chunks=[]
          for rep in reports:
              x,_=sf.read(ROOT/rep['runtime_file'],always_2d=True,dtype='float32')
              b=rep['A_seconds']
              s=max(0,int((b-5)*SR)); e=min(len(x),int((b+10)*SR))
              chunks.append(x[s:e]); chunks.append(np.zeros((int(.5*SR),2),np.float32))
          reel=np.vstack(chunks[:-1])
          reelwav=outdir/'A_to_B_audition.wav'
          reelmp3=outdir/'A_to_B_audition.mp3'
          sf.write(reelwav,reel,SR,subtype='PCM_16')
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(reelwav),'-c:a','libmp3lame','-q:a','2',str(reelmp3)],check=True)
          (outdir/'audio_report.json').write_text(json.dumps(reports,indent=2),encoding='utf-8')
          PY
          python /tmp/render_bgm.py

