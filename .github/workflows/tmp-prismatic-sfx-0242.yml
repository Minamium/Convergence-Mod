name: Temporary prismatic SFX 0.2.42

on:
  push:
    branches:
      - audio/orchestral-abc-0.2.42

permissions:
  contents: write

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/orchestral-abc-0.2.42
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install numpy==2.3.5 scipy==1.16.1 soundfile==0.14.0
      - name: Render fourteen SFX
        env:
          RENDER_B64: 
        run: |
          python - <<'PY'
          import os,gzip,base64
          open('/tmp/render_sfx.py','wb').write(gzip.decompress(base64.b64decode(os.environ['RENDER_B64'])))
          PY
          python /tmp/render_sfx.py
      - name: Update audio documentation
        env:
          DOCS_B64: 
        run: |
          python - <<'PY'
          import os,gzip,base64
          open('/tmp/update_sfx_docs.py','wb').write(gzip.decompress(base64.b64decode(os.environ['DOCS_B64'])))
          PY
          python /tmp/update_sfx_docs.py
      - name: Verify repository
        run: |
          python -m pip install -r tools/requirements-ci.txt
          python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --write-catalog
          git diff --check
      - name: Commit SFX implementation
        run: |
          rm .github/workflows/tmp-prismatic-sfx-0242.yml
          rm -f .github/workflows/tmp-fix-sfx-evidence-newline.yml
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild First Severance prismatic and dimensional SFX (0.2.42)'
          git push origin HEAD:audio/orchestral-abc-0.2.42
      - name: Upload audition evidence
        uses: actions/upload-artifact@v4
        with:
          name: convergence-sfx-0242-audition
          path: |
            /tmp/convergence-sfx-0242/SFX_0.2.42_new14.mp3
            /tmp/convergence-sfx-0242/audio_report.json
          if-no-files-found: error
