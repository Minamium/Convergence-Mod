name: Scarlet v2 source checks
on:
  push:
    branches: [feat/scarlet-luminance-presentation-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scarlet-v2-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.424
      - run: python -m pip install --disable-pip-version-check --requirement tools/requirements-ci.txt
      - run: python -m unittest discover -s tools/tests
      - run: python .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --with-domain --with-codec
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.424
      - run: python tools/verify_scarlet_api.py --work-dir '${{ runner.temp }}/scarlet-api'
      - run: python tools/verify_scarlet_runtime.py '${{ runner.temp }}/scarlet-api'
