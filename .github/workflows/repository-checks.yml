name: Repository checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      mod_build:
        description: 'Build on the separately provisioned pinned Windows runner (main only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 8.0.424
      - name: Install YAML validator dependency
        run: python3 -m pip install --disable-pip-version-check --requirement tools/requirements-ci.txt
      - name: Check verifier command and failure contracts
        run: python3 -m unittest discover -s tools/tests
      - name: Static, linked domain and compiled codec checks (no Terraria install)
        run: python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --with-domain --with-codec

  mod-build:
    if: github.event_name == 'workflow_dispatch' && inputs.mod_build && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, convergence-tml]
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: Convergence
      - name: Build only against the explicitly provisioned disposable profile
        shell: pwsh
        working-directory: Convergence
        run: |
          if (-not $env:TML_PATH -or -not $env:TML_SAVE_PATH) { throw 'Set pinned TML_PATH and disposable TML_SAVE_PATH on this runner' }
          python tools/dev.py build --native --tml "$env:TML_PATH" --save "$env:TML_SAVE_PATH" --release-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-native-hurt.ps1 -PackagePath "$env:TML_SAVE_PATH/Mods/Convergence.tmod" -TModLoaderPath "$env:TML_PATH" -AssemblyOutput .local/candidate.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-codec.ps1 -AssemblyPath .local/candidate.dll
