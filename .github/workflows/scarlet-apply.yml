name: Commit verified Scarlet implementation
on:
  push:
    branches: [feat/scarlet-rhythm-phases]
    paths: [.github/scarlet-transfer/**, .github/workflows/scarlet-apply.yml]
permissions:
  contents: write
concurrency:
  group: scarlet-apply-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Minamium/Convergence-Mod' && github.ref == 'refs/heads/feat/scarlet-rhythm-phases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.424
      - run: python3 -m pip install --disable-pip-version-check --requirement tools/requirements-ci.txt
      - name: Apply exact implementation and remove transfer-only files
        run: |
          python3 .github/scarlet-transfer/apply.py
          git rm -r .github/scarlet-transfer .github/workflows/scarlet-apply.yml
      - run: python3 -m unittest discover -s tools/tests
      - run: python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --write-catalog --with-domain --with-codec
      - name: Commit only to the requested feature branch
        run: |
          git add --all
          git diff --cached --check
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: implement Scarlet rhythm phases, movement and boss bar'
          git push origin HEAD:refs/heads/feat/scarlet-rhythm-phases
