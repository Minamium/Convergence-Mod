name: Apply Fukou V8 section loops

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fukou-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tools and verify base assets
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          cat > /tmp/expected.sha256 <<'EOF'
          39b6d164f46e514078cae9dcefa887ae6359dd7d4c6380129f64404517c191c2  Assets/Music/ObsidianLiturgy.ogg
          fac5a5b6b580ddff0615c3c302377b96ba19759904ce5ec561d8e417c9e964f8  Assets/Music/UnboundLiturgy.ogg
          a19fe1f848a777e825b2bc7701aa78858e3e585183dae89656e767826db162ec  Assets/Music/DistantLiturgy.ogg
          f18b080345073b765b614ac9310f18a78fd255ff683223de7d318d6bfacbc94d  Assets/Music/TerminalLiturgy.ogg
          EOF
          sha256sum -c /tmp/expected.sha256
          grep -q '^version = 0.2.46$' build.txt

      - name: Render section-loop phase masters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fukou-v8

          ffmpeg -y -hide_banner -loglevel error \
            -i Assets/Music/ObsidianLiturgy.ogg \
            -map_metadata -1 -af 'volume=6.25dB' \
            -ar 48000 -ac 2 -c:a libvorbis -b:a 224k \
            /tmp/fukou-v8/ObsidianLiturgy.ogg

          ffmpeg -y -hide_banner -loglevel error \
            -i Assets/Music/UnboundLiturgy.ogg \
            -map_metadata -1 \
            -af 'atrim=start=40.873:end=94.068,asetpts=PTS-STARTPTS,volume=0.75dB,afade=t=in:st=0:d=0.020,afade=t=out:st=53.175:d=0.020' \
            -ar 48000 -ac 2 -c:a libvorbis -b:a 224k \
            /tmp/fukou-v8/UnboundLiturgy.ogg

          ffmpeg -y -hide_banner -loglevel error \
            -i Assets/Music/DistantLiturgy.ogg \
            -map_metadata -1 \
            -af 'atrim=start=92.523:end=138.485,asetpts=PTS-STARTPTS,afade=t=in:st=0:d=0.020,afade=t=out:st=45.942:d=0.020' \
            -ar 48000 -ac 2 -c:a libvorbis -b:a 224k \
            /tmp/fukou-v8/DistantLiturgy.ogg

          ffmpeg -y -hide_banner -loglevel error \
            -i Assets/Music/TerminalLiturgy.ogg \
            -map_metadata -1 \
            -af 'atrim=start=145.721:end=170.849,asetpts=PTS-STARTPTS,volume=-0.60dB,afade=t=in:st=0:d=0.020,afade=t=out:st=25.108:d=0.020' \
            -ar 48000 -ac 2 -c:a libvorbis -b:a 224k \
            /tmp/fukou-v8/TerminalLiturgy.ogg

          cp /tmp/fukou-v8/*.ogg Assets/Music/

      - name: Patch transition music selection, version, docs and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, subprocess

          root = pathlib.Path('.')
          presentation = root / 'Client/Encounters/FirstSeverance/FirstSeverancePrototypePresentation.cs'
          text = presentation.read_text(encoding='utf-8')
          old = '''    public override int Music => Main.dedServ ? -1 : MusicLoader.GetMusicSlot(Mod,
                  ModContent.GetInstance<FirstSeveranceClientStateSystem>().Combat?.BossPhase switch
                  {
                      FirstSeveranceBossPhase.Final => "Assets/Music/TerminalLiturgy",
                      FirstSeveranceBossPhase.Distant => "Assets/Music/DistantLiturgy",
                      FirstSeveranceBossPhase.Unbound => "Assets/Music/UnboundLiturgy",
                      _ => "Assets/Music/ObsidianLiturgy",
                  });'''
          new = '''    private static FirstSeveranceBossPhase MusicPhase(FirstSeveranceCombatProjection? combat)
              => combat is { Substate: FirstSeveranceSubstate.PhaseTransition }
                  ? combat.BossPhase switch
                  {
                      FirstSeveranceBossPhase.Final => FirstSeveranceBossPhase.Distant,
                      FirstSeveranceBossPhase.Distant => FirstSeveranceBossPhase.Unbound,
                      FirstSeveranceBossPhase.Unbound => FirstSeveranceBossPhase.Sealed,
                      _ => combat.BossPhase,
                  }
                  : combat?.BossPhase ?? FirstSeveranceBossPhase.Sealed;

              public override int Music => Main.dedServ ? -1 : MusicLoader.GetMusicSlot(Mod,
                  MusicPhase(ModContent.GetInstance<FirstSeveranceClientStateSystem>().Combat) switch
                  {
                      FirstSeveranceBossPhase.Final => "Assets/Music/TerminalLiturgy",
                      FirstSeveranceBossPhase.Distant => "Assets/Music/DistantLiturgy",
                      FirstSeveranceBossPhase.Unbound => "Assets/Music/UnboundLiturgy",
                      _ => "Assets/Music/ObsidianLiturgy",
                  });'''
          if old not in text:
              raise SystemExit('music selector anchor not found')
          presentation.write_text(text.replace(old, new, 1), encoding='utf-8')

          build = root / 'build.txt'
          b = build.read_text(encoding='utf-8')
          if 'version = 0.2.46' not in b:
              raise SystemExit('build version anchor not found')
          build.write_text(b.replace('version = 0.2.46', 'version = 0.2.47', 1), encoding='utf-8')

          files = {
              'P1': root/'Assets/Music/ObsidianLiturgy.ogg',
              'P2': root/'Assets/Music/UnboundLiturgy.ogg',
              'P3': root/'Assets/Music/DistantLiturgy.ogg',
              'Final': root/'Assets/Music/TerminalLiturgy.ogg',
          }

          def probe(path: pathlib.Path):
              info = json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','stream=sample_rate,channels',
                  '-show_entries','format=duration','-of','json',str(path)
              ], text=True))
              run = subprocess.run([
                  'ffmpeg','-hide_banner','-nostats','-i',str(path),
                  '-filter_complex','ebur128=peak=true','-f','null','-'
              ], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True, check=True)
              summary = run.stderr.rsplit('Summary:', 1)[-1]
              im = re.search(r'I:\s*(-?\d+(?:\.\d+)?) LUFS', summary)
              pm = re.search(r'Peak:\s*(-?\d+(?:\.\d+)?) dBFS', summary)
              if not im or not pm:
                  raise SystemExit(f'failed to parse ebur128 for {path}')
              stream = info['streams'][0]
              return {
                  'bytes': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'sample_rate': int(stream['sample_rate']),
                  'channels': int(stream['channels']),
                  'duration_seconds': round(float(info['format']['duration']), 6),
                  'lufs_i': float(im.group(1)),
                  'true_peak_dbfs': float(pm.group(1)),
              }

          metrics = {k: probe(v) for k,v in files.items()}
          for name, m in metrics.items():
              assert m['sample_rate'] == 48000 and m['channels'] == 2, (name, m)
              assert m['true_peak_dbfs'] <= -0.2, (name, m)
          assert -14.8 <= metrics['P1']['lufs_i'] <= -13.2, metrics['P1']
          assert -13.7 <= metrics['P2']['lufs_i'] <= -12.2, metrics['P2']
          assert -11.3 <= metrics['P3']['lufs_i'] <= -9.7, metrics['P3']
          assert -10.7 <= metrics['Final']['lufs_i'] <= -8.8, metrics['Final']
          assert metrics['P1']['lufs_i'] < metrics['P2']['lufs_i'] < metrics['P3']['lufs_i'] < metrics['Final']['lufs_i']

          evidence = {
              'date': '2026-09-11',
              'version': '0.2.47',
              'protocol': 28,
              'scope': 'First Severance phase-music handoff, V8 section loops and BGM loudness; gameplay/network/SFX unchanged',
              'source': {
                  'basis': '0.2.46 approved EigHt 不幸な人形劇 runtime phase masters already committed to the repository',
                  'prior_hashes': {
                      'P1': '39b6d164f46e514078cae9dcefa887ae6359dd7d4c6380129f64404517c191c2',
                      'P2': 'fac5a5b6b580ddff0615c3c302377b96ba19759904ce5ec561d8e417c9e964f8',
                      'P3': 'a19fe1f848a777e825b2bc7701aa78858e3e585183dae89656e767826db162ec',
                      'Final': 'f18b080345073b765b614ac9310f18a78fd255ff683223de7d318d6bfacbc94d',
                  },
                  'third_party_rights': 'unchanged from Assets/ATTRIBUTION.md 0.2.46 EigHt record; no new source recording introduced',
              },
              'edit': {
                  'transition_music': 'During PhaseTransition, music selection intentionally resolves to the previous BossPhase. The new phase track begins only when the transition substate ends; BossPhase/gameplay/visual/SFX state remains unchanged.',
                  'P1': 'full 0.2.46 phase master, +6.25 dB static gain',
                  'P2': 'processed-master 40.873s..94.068s, +0.75 dB, 20 ms entry/exit fades',
                  'P3': 'processed-master 92.523s..138.485s, 20 ms entry/exit fades',
                  'Final': 'processed-master 145.721s..170.849s, -0.60 dB for encode headroom, 20 ms entry/exit fades',
                  'loop_policy': 'P2/P3/Final files contain only the selected high-energy section; deleted earlier material cannot reappear on an ordinary whole-file loop.',
              },
              'runtime_assets': metrics,
              'verification': {
                  'audio': 'passed: all four OGGs decode as 48 kHz stereo, bounded true peak, monotonic integrated loudness from P1 through Final',
                  'repository_static': 'pending workflow verifier step',
                  'git_diff_check': 'pending workflow verifier step',
                  'native_mod_build': 'not_run in Linux one-shot workflow; C# change is presentation-only and requires user in-game confirmation',
                  'runtime': 'not_run: user-owned transition/loop/mix listening',
              },
          }
          evpath = root/'docs/evidence/2026-09-11-fukou-section-loops-mix.json'
          evpath.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audio = root/'docs/AUDIO_CUE_SHEET.md'
          a = audio.read_text(encoding='utf-8')
          marker = 'Current implementation is governed by the first section\'s overrides and the shared encounter/recovery specs. Versioned preceding sections preserve design history, not additional tuning or work orders. Exact timings, widths, gains and durations live in the relevant code/assets; do not restore an older value from a historical paragraph.\n'
          section = '''\n## Section-loop handoff and stronger BGM mix — 0.2.47\n\nPhase transitions no longer request the next phase track as soon as the BossPhase value advances. While the authoritative combat substate is `PhaseTransition`, the scene effect keeps requesting the previous phase music slot, so the existing track continues through the 6.0s / 5.0s / 4.0s transformation. The new phase track begins only when the transition substate resolves into the first attack. This is presentation-only: BossPhase, transformation SFX/visuals, HP gates, authority timing and protocol remain unchanged.\n\nP2/P3/Final now use only their selected high-energy source sections, so a normal whole-file loop cannot return to the deleted slow opening. P2 uses the processed-master 40.873–94.068s region, P3 92.523–138.485s, and Final 145.721–170.849s; each receives a 20ms edge fade for an encoded anti-click boundary. P1 remains the full phase form.\n\nThe BGM master balance is raised rather than reducing warning SFX or mutating user sliders. P1 receives +6.25dB and P2 +0.75dB; P3 keeps its accepted level and Final is trimmed 0.60dB only for encode headroom. Integrated loudness is approximately **-14.0 / -12.9 / -10.5 / -9.8 LUFS-I** from P1 through Final, preserving phase escalation while keeping the lower phases materially more audible against the positionless raid cues. Exact hashes and decode measurements are in [0.2.47 evidence](evidence/2026-09-11-fukou-section-loops-mix.json). In-game perceived balance and transition timing remain user-owned listening checks.\n\n'''
          if '## Section-loop handoff and stronger BGM mix — 0.2.47' not in a:
              if marker not in a:
                  raise SystemExit('audio cue insertion anchor missing')
              a = a.replace(marker, marker + section, 1)
              audio.write_text(a, encoding='utf-8')

          status = root/'docs/STATUS.md'
          s = status.read_text(encoding='utf-8')
          old_status = 'Development **0.2.46**, protocol **28**. [First Severance phase BGM](AUDIO_CUE_SHEET.md#eight-phase-progression-bgm--0246) now uses the owner-approved EigHt `不幸な人形劇` free-BGM source as one musical identity: P1/P2 start slower, lower-pitched and stripped, P3 reaches the published 218-BPM/full arrangement, and Final rises slightly further. Existing cue filenames/scene selection and gameplay timing are unchanged. The 0.2.45 SFX rollback and preparation silence remain.'
          new_status = 'Development **0.2.47**, protocol **28**. [First Severance phase BGM](AUDIO_CUE_SHEET.md#section-loop-handoff-and-stronger-bgm-mix--0247) now holds the previous track through each PhaseTransition, then starts the next phase at its selected high-energy section when the first attack begins. P2/P3/Final are section-only loops that cannot return to the removed slow opening; P1/P2 mastering is raised so BGM remains present against raid SFX while preserving a P1 -> P2 -> P3 -> Final loudness ramp. Gameplay authority, phase timing, SFX, protocol and preparation silence are unchanged.'
          if old_status not in s:
              raise SystemExit('status current-build anchor missing')
          s = s.replace(old_status, new_status, 1)
          vmark = '## Verification state\n\n'
          vpara = '[0.2.47 BGM handoff/mix checks](evidence/2026-09-11-fukou-section-loops-mix.json) own the V8 section ranges, transition-slot rule, four-master hashes, 48kHz/stereo/duration/LUFS/true-peak checks and repository verification. C# changes are presentation-only; native package and in-game transition/loop/mix listening remain user-owned `not_run`.\n\n'
          if vpara not in s:
              if vmark not in s:
                  raise SystemExit('status verification anchor missing')
              s = s.replace(vmark, vmark + vpara, 1)
          status.write_text(s, encoding='utf-8')

          attr = root/'Assets/ATTRIBUTION.md'
          at = attr.read_text(encoding='utf-8')
          header = '## EigHt `不幸な人形劇` section-loop / mix revision — 0.2.47'
          if header not in at:
              rows = '\n'.join(
                  f"| `Assets/Music/{files[k].name}` | {metrics[k]['duration_seconds']:.3f}s | {metrics[k]['lufs_i']:.1f} LUFS-I | {metrics[k]['true_peak_dbfs']:.1f} dBTP | `{metrics[k]['sha256']}` |"
                  for k in ('P1','P2','P3','Final')
              )
              block = f'''\n\n{header}\n\n- Creator/composer, work, source, governing terms and redistribution conditions remain exactly the **0.2.46 EigHt `不幸な人形劇`** record above; this revision introduces no new third-party recording or composition.\n- Edit basis: the four already-approved 0.2.46 runtime phase masters. P1 remains full-form and receives +6.25dB static gain. P2 is cropped to processed-master 40.873–94.068s and receives +0.75dB. P3 is cropped to 92.523–138.485s. Final is cropped to 145.721–170.849s and reduced 0.60dB for encode headroom. P2/P3/Final receive 20ms entry/exit anti-click fades.\n- Playback change: during the 6.0s/5.0s/4.0s `PhaseTransition` windows the previous phase music slot is retained; the next file starts only after the transformation resolves. This changes no composition, SFX source, user slider, gameplay clock or network state.\n- Loop rule: P2/P3/Final contain only their selected section, therefore an ordinary whole-file loop cannot reintroduce the discarded opening material.\n\n| Runtime asset | Duration | Loudness | True peak | SHA-256 |\n|---|---:|---:|---:|---|\n{rows}\n'''
              attr.write_text(at.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Repository verification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests
          python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py --write-catalog .
          git diff --check
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('docs/evidence/2026-09-11-fukou-section-loops-mix.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['verification']['repository_static'] = 'passed: verify_repo.py --write-catalog .'
          data['verification']['git_diff_check'] = 'passed'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py --write-catalog .
          git diff --check

      - name: Commit and push 0.2.47
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Music Client/Encounters/FirstSeverance/FirstSeverancePrototypePresentation.cs Assets/ATTRIBUTION.md docs build.txt
          git status --short
          git commit -m 'Align phase music handoff and strengthen BGM mix (0.2.47)'
          git push origin HEAD:main
