name: Temporary finalize prismatic SFX 0.2.42

on:
  push:
    branches:
      - audio/orchestral-abc-0.2.42

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Rebuild First Severance prismatic and dimensional SFX (0.2.42)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audio/orchestral-abc-0.2.42
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install numpy==2.3.5 scipy==1.16.1 soundfile==0.14.0
      - name: Reuse the approved deterministic recipes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          text=Path('.github/workflows/tmp-prismatic-sfx-0242.yml').read_text(encoding='utf-8')
          for key,dst in [('RENDER_B64','/tmp/render_sfx.py'),('DOCS_B64','/tmp/update_sfx_docs.py')]:
              m=re.search(r'^\s*'+key+r':\s*(\S+)\s*$',text,re.M)
              if not m: raise SystemExit(f'{key} payload not found')
              Path(dst).write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          python /tmp/render_sfx.py
          python /tmp/update_sfx_docs.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Assets/ATTRIBUTION.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip('\n')+'\n',encoding='utf-8')
          PY
      - name: Verify repository
        run: |
          python -m pip install -r tools/requirements-ci.txt
          python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --write-catalog
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/Sounds/FirstSeverance Assets/ATTRIBUTION.md docs
          git commit -m 'Rebuild First Severance prismatic and dimensional SFX (0.2.42)'
          git push origin HEAD:audio/orchestral-abc-0.2.42
      - name: Upload audition evidence
        uses: actions/upload-artifact@v4
        with:
          name: convergence-sfx-0242-audition-final
          path: |
            /tmp/convergence-sfx-0242/SFX_0.2.42_new14.mp3
            /tmp/convergence-sfx-0242/audio_report.json
          if-no-files-found: error
