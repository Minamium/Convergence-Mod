name: Scarlet v2 source staging
on:
  push:
    branches: [feat/scarlet-luminance-presentation-v2]
    paths: [.github/workflows/scarlet-v2-transfer.yml]
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export main and the existing Scarlet prerequisite separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer
          git archive --format=zip --output=transfer/main.zip HEAD
          git fetch --no-tags origin 4ffa57d508c7b7ab1ff6ea737a735c4846089077
          git archive --format=zip --output=transfer/scarlet-prerequisite.zip 4ffa57d508c7b7ab1ff6ea737a735c4846089077
          curl --fail --location --retry 3 https://github.com/tModLoader/tModLoader/releases/download/v2026.07.3.0/tModLoader.zip -o transfer/tModLoader.zip
          echo '6f51610f4b0f167d1620d0e8c83264ba14e047421e97d9f8053eb40e3d764e1a  transfer/tModLoader.zip' | sha256sum -c -
          curl --fail --location --retry 3 https://codeload.github.com/LucilleKarma/Luminance/zip/b2468dfd2f299597602dc6826af781d436c29a57 -o transfer/luminance-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scarlet-v2-build-inputs
          path: transfer/*.zip
          retention-days: 1
