name: Finalize Scarlet v2 recovery
on:
  push:
    branches: [feat/scarlet-luminance-presentation-v2]
    paths: [.github/workflows/scarlet-v2-finalize.yml]
permissions:
  contents: read
concurrency:
  group: scarlet-v2-finalize
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/feat/scarlet-luminance-presentation-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.424
      - run: python -m pip install --disable-pip-version-check --requirement tools/requirements-ci.txt
      - run: python tools/_scarlet_v2_finalize.py
      - name: Complete Japanese labels and record CPU probe scope
        shell: python
        run: |
          from pathlib import Path
          import json
          p = Path('Localization/CrimsonFoundry/ja-JP.hjson')
          text = p.read_text(encoding='utf-8')
          if 'CinematicCamera:' not in text:
              assert text.count('        ScreenShake: {') == 1
              text = text.replace('        ScreenShake: {', '        CinematicCamera: { Label: "フェーズ移行時のカメラ" Tooltip: "無敵の移行時間中だけ緩く視点を動かします。操作は制限しません。" }\n        ScreenShake: {')
          text = text.replace('異形と一体ずつ戦い、HP20%で次へ。', '異形と一体ずつ戦い、HP20%で行動を一巡してから次へ。')
          text = text.replace('試作版：1～8人。', '試遊調整：敵の攻撃ダメージ1、HP減量。1～8人。')
          p.write_text(text, encoding='utf-8', newline='\n')
          p = Path('docs/evidence/2026-09-17-scarlet-presentation-v2.json')
          evidence = json.loads(p.read_text())
          evidence['cpu_lifecycle_probe'] = {'status': 'passed', 'source_commit': 'd091c2d0c73039728dc2ac02f566d470200e4da7', 'run': 'https://github.com/Minamium/Convergence-Mod/actions/runs/35177807736', 'articulation_updates': 3600, 'fna_batch_accessor': 'passed', 'scope': 'linked production FSM/Verlet updates and actual FNA field bindings; not GPU drawing or native game load'}
          p.write_text(json.dumps(evidence, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
      - name: Record exact original shader exports in indexed attribution section
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          register = Path('Assets/ATTRIBUTION.md')
          text = register.read_text(encoding='utf-8')
          assert text.count('## Records\n') == 1
          root = Path('Assets/AutoloadedEffects/Shaders')
          for name in ('ScarletSurface', 'ScarletRibbon', 'ScarletResidue', 'ScarletBackdrop'):
              source = root / (name + '.fx')
              export = root / (name + '.fxc')
              assert source.is_file() and export.is_file(), name
              record = '\n'.join([
                  f'### {name} original shader export — 2026-09-17', '',
                  f'- Runtime file: `{export.as_posix()}`',
                  f'- Asset ID: scarlet-v2-{name.lower()}-20260917',
                  '- Asset type: compiled original HLSL effect',
                  '- Creator: project-directed independent implementation by OpenAI for Minamium',
                  '- Creation/acquisition date: 2026-09-17',
                  '- Source type: original',
                  f'- Source work and URL: repository source `{source.as_posix()}`; no third-party shader copied',
                  '- Tool/model/version: FXC compiler and options pinned in `Assets/AutoloadedEffects/Shaders/compiled.json`',
                  '- Human modifications: runtime material parameters, masks and animation are project code; compilation does not modify approved images',
                  '- License and redistribution terms: original project asset under the existing project terms; dependency textures remain external',
                  '- Required attribution: retain this provenance, source and compiler/export identity manifest',
                  '- Reviewer and review date: automated source/export checks, 2026-09-17; native visual approval not_run',
                  '- Prompt or brief location: `docs/encounters/crimson-foundry/ENCOUNTER_SPEC.md`, presentation v2',
                  f'- SHA256: `{hashlib.sha256(export.read_bytes()).hexdigest()}`',
                  f'- Source SHA256: `{hashlib.sha256(source.read_bytes()).hexdigest()}`',
              ])
              marker = f'- Runtime file: `{export.as_posix()}`'
              records = text.split('## Records\n', 1)[1].split('\n## ', 1)[0]
              if marker not in records:
                  text = text.replace('## Records\n', '## Records\n\n' + record + '\n', 1)
          register.write_text(text, encoding='utf-8', newline='\n')
      - name: Remove and stage one-time recovery machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/scarlet-v2-transfer.yml .github/workflows/scarlet-v2-shaders.yml .github/workflows/scarlet-v2-recover.yml .github/workflows/scarlet-v2-apply.yml .github/workflows/scarlet-v2-finalize.yml
          git rm tools/_scarlet_v2_apply.py tools/_scarlet_v2_finalize.py
          git add docs Assets/ATTRIBUTION.md CHANGELOG.md README.md description.txt Localization/CrimsonFoundry tools/tests/test_presentation_contracts.py
      - name: Python source/tooling regression checks
        run: python -m unittest discover -s tools/tests
      - name: Catalog, repository, domain and protocol checks
        run: python .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --write-catalog --with-domain --with-codec
      - name: Compile all production source against inspected APIs
        if: always()
        run: python tools/verify_scarlet_api.py --work-dir '${{ runner.temp }}/scarlet-api'
      - name: Linked-production CPU lifecycle probes (not drawing)
        if: always()
        run: python tools/verify_scarlet_runtime.py '${{ runner.temp }}/scarlet-api'
      - name: Checkpoint verified documentation and remove temporary write workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs Assets/ATTRIBUTION.md CHANGELOG.md README.md description.txt Localization/CrimsonFoundry tools/tests/test_presentation_contracts.py
          git add -u .github/workflows tools
          git diff --cached --check
          git commit -m 'docs: finalize Scarlet rehearsal contracts and remove recovery workflows'
          git push origin HEAD:refs/heads/feat/scarlet-luminance-presentation-v2
