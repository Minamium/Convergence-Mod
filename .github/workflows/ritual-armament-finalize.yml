name: Finish authorized ritual weapon branch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
concurrency:
  group: ritual-armament-one-shot
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'Minamium/tmod' && github.actor == 'Minamium' && github.event.pull_request.head.repo.full_name == 'Minamium/tmod' && github.event.pull_request.head.ref == 'feat/ritual-armaments-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.424
      - name: Guard exact feature head and finish sources
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/feat/ritual-armaments-20260908 | cut -f1)"
          python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          python3 tools/finalize_ritual_armaments.py
          python3 -m unittest discover -s tools/tests
          python3 .agents/skills/develop-convergence-raids/scripts/verify_repo.py . --with-domain --with-codec
      - name: Record checks and commit only to the authorized feature branch
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/evidence/2026-09-08-ritual-armaments.json')
          e = json.loads(p.read_text())
          e['checks']['final_assembly'] = 'Passed repository/catalog/YAML, tooling unit tests, linked domain tests and compiled codec checks before this feature-branch commit. Full Mod build remains not_run.'
          p.write_text(json.dumps(e, indent=2) + '\n')
          PY
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: finish approved ritual weapon art, localization and handoff'
          git push origin HEAD:refs/heads/feat/ritual-armaments-20260908
          git archive HEAD > /tmp/ritual-armament-final-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ritual-armament-final-source
          path: /tmp/ritual-armament-final-source.tar
          retention-days: 1
