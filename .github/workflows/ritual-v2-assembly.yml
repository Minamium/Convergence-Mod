name: Assemble and verify authorized ritual armaments v2
on:
  push:
    branches: [feat/ritual-armaments-v2]
    paths:
      - tools/assemble_ritual_v2.py
      - tools/.ritual-v2-payload-*.txt
permissions:
  contents: write
concurrency:
  group: ritual-v2-assembly
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'Minamium/tmod' && github.ref == 'refs/heads/feat/ritual-armaments-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: 8.0.424
      - name: Assemble artwork, compile real API, verify and commit only to feature branch
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt Pillow==11.3.0
          python3 tools/assemble_ritual_v2.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ritual-armaments-v2-final-source
          path: ${{ runner.temp }}/ritual-v2-final-source.tar
          retention-days: 1
          if-no-files-found: error
