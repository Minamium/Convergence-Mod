name: Scarlet v2 shader verification
on:
  push:
    branches: [feat/scarlet-luminance-presentation-v2]
    paths: [.github/workflows/scarlet-v2-shaders.yml]
permissions:
  contents: read
jobs:
  shaders:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and expand original shader sources
        shell: python
        run: |
          import base64, hashlib, json, pathlib, zlib
          payload = base64.b64decode('')
          assert hashlib.sha256(payload).hexdigest() == 'd52f4bb7889f1c95a72cbf620c65b84fb4b5d6f643ae8652470b2a97179da7e2'
          root = pathlib.Path('Assets/AutoloadedEffects/Shaders')
          for name, text in json.loads(zlib.decompress(payload)).items():
              assert name.startswith('Scarlet') and name.endswith('.fx') and '/' not in name
              (root / name).write_text(text, encoding='utf-8', newline='\n')
      - name: Acquire exact compiler source distribution
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://codeload.github.com/LucilleKarma/Luminance/zip/b2468dfd2f299597602dc6826af781d436c29a57' -OutFile lum.zip
          Expand-Archive lum.zip .lum
          $compiler = Get-ChildItem .lum -Recurse -Filter fxc.exe | Select-Object -First 1 -ExpandProperty FullName
          python tools/compile_shaders.py --fxc $compiler
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scarlet-v2-compiled-shaders
          path: |
            Assets/AutoloadedEffects/Shaders/*.fx
            Assets/AutoloadedEffects/Shaders/*.fxc
            Assets/AutoloadedEffects/Shaders/compiled.json
          retention-days: 1
